name: nexus_audio
description: "Nexus Audio's PC streams (ABP v2 over TLS: mic to PC, PC audio here, phone audio to PC) as an Android-only Flutter plugin."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.nexus.nexus_audio
        pluginClass: NexusAudioPlugin
